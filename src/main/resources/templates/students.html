<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="ISO-8859-1">
	<title>Student Management</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
		integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>

<body>


  <!-- Image and text -->
  <ul class="nav justify-content-center">
<nav class="navbar navbar-dark bg-primary">
  <a class="navbar-brand" href="#" style="color: black; font-weight: bolder; font-size: 24px; font-family: 'Times New Roman', Times, serif;">
    Student Management System
  </a>
</nav>
</ul>

<br><br>

	<div class ="container">
		<div class = "row">
			<h2 style="color: black; font-weight: 700; font-family: 'Times New Roman', Times, serif;"> All Students Details</h2>
		</div>
		<br>
		<div class = "row">
			<div class = "col-lg-4">
				<a th:href = "@{/students/new}" class="btn btn-info" style="font-size: 20px;"> Add Student</a>
			</div>
		</div>
		<br>
		<table class = "table table-dark">
			<thead>
				<tr>
					<th> Student Id</th>
					<th> Student First Name</th>
					<th> Student Last Name</th>
					<th> Student Email </th>
					<th> Actions </th>
				</tr>
			</thead>
			
			<tbody>
				<tr th:each = "student: ${students}">
					<td th:text = "${student.id}"></td>
					<td th:text = "${student.firstName}"></td>
					<td th:text = "${student.lastName}"></td>
					<td th:text = "${student.email}"></td>
					<td>
						<a th:href = "@{/students/edit/{id}(id=${student.id})}"
						 class = "btn btn-warning">Update</a>
						&nbsp;
						<a th:href = "@{/students/{id}(id=${student.id})}"
						 class = "btn btn-danger">Delete</a>
						 
					</td>
				</tr>
			</tbody>
		
		</table>
		
	</div>

</body>

</html>
